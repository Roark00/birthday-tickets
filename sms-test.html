<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Text link test</title>
<style>
  body { margin: 0; padding: 24px 16px 48px; font: 18px/1.4 -apple-system, system-ui, sans-serif; background: #F4F1EC; color: #1A1446; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  p { margin: 0 0 16px; }
  label { display: block; font-weight: 600; margin: 8px 0 6px; }
  input { width: 100%; box-sizing: border-box; font: inherit; padding: 12px; border: 2px solid #1A1446; border-radius: 10px; }
  ol { padding-left: 1.4em; }
  li { margin: 14px 0; }
  a { display: inline-block; padding: 12px 16px; border-radius: 10px; background: #1A1446; color: #fff; text-decoration: none; font-weight: 600; }
  code { font-size: 14px; color: #555; display: block; margin-top: 4px; word-break: break-all; }
</style>
</head>
<body>
<h1>Text link test</h1>
<p>Tap each button on the iPhone. Note which ones open Messages <b>with the test text already filled in</b>, then tell Claude the numbers. Nothing is sent unless you tap Send.</p>
<label for="num">Your number (optional, stays on this page)</label>
<input id="num" inputmode="tel" placeholder="+13105550100" autocomplete="off">
<ol id="list"></ol>
<script>
  const FORMS = [
    ["No number, &", n => `sms:${n}&body=`],
    ["No number, ?", n => `sms:${n}?body=`],
    ["No number, ?&", n => `sms:${n}?&body=`],
    ["No number, ;", n => `sms:${n};body=`]
  ];
  function draw() {
    const n = document.getElementById("num").value.replace(/[^\d+]/g, "");
    document.getElementById("list").innerHTML = FORMS.map(([label, f], i) => {
      const href = f(n) + encodeURIComponent(`Test ${i + 1} from the ticket book`);
      return `<li><a href="${href}">Test ${i + 1}</a><code>${href.replace(/</g, "&lt;")}</code></li>`;
    }).join("");
  }
  document.getElementById("num").addEventListener("input", draw);
  draw();
</script>
</body>
</html>
