<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ticket book: options</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&display=swap">
<style>
  body { margin: 0; padding: 24px; background: #ECE9E2; font-family: -apple-system, system-ui, sans-serif; color: #222; }
  .grid { display: grid; grid-template-columns: repeat(var(--n), 390px); gap: 24px; }
  .col h2 { margin: 0 0 2px; font-family: "Big Shoulders Display", sans-serif; font-weight: 800; font-size: 34px; line-height: 1; }
  .col p { margin: 0 0 10px; font-size: 14px; color: #555; min-height: 2.6em; }
  iframe { display: block; width: 390px; height: 844px; border: 0; border-radius: 28px; box-shadow: 0 2px 0 rgba(0,0,0,.08); background: #fff; }
  iframe + iframe { margin-top: 16px; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
  // Hide the install tip and skip the deal animation so every frame shows the settled page.
  try { for (const p of ["vt26.", "vt26p."]) { localStorage.setItem(p + "tipDone", "1"); localStorage.setItem(p + "dealt", "1"); localStorage.removeItem(p + "state"); } } catch (e) {}
  const THEMES = [
    ["", "Ultramarine (current)", "Raffle tickets on a bright blue table."],
    ["garden", "Night Garden", "Deep evening green. All three palette reviewers proposed a version."],
    ["tomato", "Tomato Matinee", "Cinema-stub red. Three reviewers proposed a warm red."],
    ["plum", "Plum Keepsake", "Softer and more intimate (Codex)."],
    ["evening", "Evening Keepsake", "Quiet slate, pastel tickets (Hermes)."],
    ["kraft", "Kraft & Crayon", "Light paper-on-desk, least app-like (Claude)."]
  ];
  const qs = new URLSearchParams(location.search);
  const only = qs.get("only");
  const page = qs.get("page") === "compact" ? "prototype-compact.html" : "index.html";
  const want = only ? only.split(",") : null;
  const list = want ? THEMES.filter(t => want.includes(t[0] || "current")) : THEMES;
  document.documentElement.style.setProperty("--n", list.length);
  document.getElementById("grid").innerHTML = list.map(([k, name, note]) => {
    const q = k ? `?theme=${k}` : "";
    return `<div class="col"><h2>${name}</h2><p>${note}</p>
      <iframe src="${page}${q}" title="${name}, top"></iframe>
      <iframe src="${page}${q}${q ? "&" : "?"}s=2#groups" title="${name}, tickets"></iframe></div>`;
  }).join("");
</script>
</body>
</html>
